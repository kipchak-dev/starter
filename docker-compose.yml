services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEBUG: "true" # Any value turns debug mode on. To turn it off, delete this line.
    ports:
      - "${PORT:-8080}:80" # PORT=8081 docker compose up uses another port
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /var/www
          ignore:
            - vendor/

  # Add the services your API uses here, such as a database, and give them a profile if they are optional:
  #
  # mysql:
  #   image: mysql:8.4
  #   profiles: [database]
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "root"
  #     MYSQL_DATABASE: "api"
  #
  # `docker compose --profile database up` then starts it with the API. The examples repository has a Compose
  # service for every Kipchak driver: https://1x.ax/mamluk/kipchak/examples
